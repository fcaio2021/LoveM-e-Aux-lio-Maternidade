<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:Onest,sans-serif;color:#1A2530;position:relative}
.foto{position:absolute;right:0;top:0;height:630px;width:800px;background:url(../src/assets/fotos/hero-gravida-3.jpg) center 40%/cover}
.foto::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,#fff 0%,rgba(255,255,255,.92) 22%,rgba(255,255,255,.35) 48%,transparent 70%)}
.texto{position:absolute;left:64px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.logo{width:150px;margin-bottom:34px}
.kicker{color:#E0006A;font-weight:700;font-size:24px;margin-bottom:12px}
h1{font-size:54px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
.valor{color:#FF0076;white-space:nowrap}
.selo{margin-top:30px;display:inline-flex;align-self:flex-start;background:#177E40;color:#fff;font-weight:700;font-size:25px;padding:14px 30px;border-radius:999px}
.dominio{position:absolute;left:64px;bottom:30px;font-size:19px;font-weight:500;color:#46525E}
</style></head><body>
<div class="foto"></div>
<div class="texto">
  <img class="logo" src="../../identidade/logo.png">
  <p class="kicker">Auxílio-maternidade do INSS</p>
  <h1>Mamãe, descubra se você tem direito a receber até <span class="valor">R$&nbsp;15.900</span></h1>
  <span class="selo">Análise gratuita</span>
</div>
<p class="dominio">lovemaeauxiliomaternidade.com.br</p>
</body></html>
